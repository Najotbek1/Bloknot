name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, test, build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke-test the build in a browser
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  android:
    name: Build Android APK
    needs: web
    runs-on: ubuntu-latest
    env:
      # Real AdMob ids from Settings → Secrets and variables → Actions → Variables (docs/ADMOB.md).
      # Unset, the app shows Google's test ads.
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      VITE_ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      VITE_ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
      VITE_ADMOB_APP_OPEN_ID: ${{ vars.ADMOB_APP_OPEN_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run android:sync
      - name: Assemble APK
        working-directory: android
        env:
          BLOKNOT_VERSION_CODE: ${{ github.run_number }}
        run: |
          export BLOKNOT_VERSION_NAME="$(node -p "require('../package.json').version")"
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../apk
          cp app/build/outputs/apk/debug/app-debug.apk "../apk/maqsad-${BLOKNOT_VERSION_NAME}-build${BLOKNOT_VERSION_CODE}.apk"
      - name: Check 16 KB page size support (Play and Galaxy Store)
        run: scripts/check-16kb.sh apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: maqsad-apk
          path: apk/*.apk
          if-no-files-found: error

  release:
    name: Build signed release (AAB + APK)
    needs: web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # The private upload key lives only in GitHub Secrets; without it this job does nothing.
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      VITE_ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      VITE_ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
      VITE_ADMOB_APP_OPEN_ID: ${{ vars.ADMOB_APP_OPEN_ID }}
    steps:
      - name: Release key missing
        if: env.HAS_RELEASE_KEY != 'true'
        run: echo "::notice::RELEASE_* secrets are not set, skipping the signed release build (see docs/play/PUBLISH.md)."
      - uses: actions/checkout@v4
        if: env.HAS_RELEASE_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_RELEASE_KEY == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        if: env.HAS_RELEASE_KEY == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_RELEASE_KEY == 'true'
      - if: env.HAS_RELEASE_KEY == 'true'
        run: npm ci
      - if: env.HAS_RELEASE_KEY == 'true'
        run: npm run android:sync
      - name: Build and sign AAB and APK
        if: env.HAS_RELEASE_KEY == 'true'
        working-directory: android
        env:
          BLOKNOT_VERSION_CODE: ${{ github.run_number }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export BLOKNOT_VERSION_NAME="$(node -p "require('../package.json').version")"
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_FILE"
          trap 'rm -f "$RELEASE_KEYSTORE_FILE"' EXIT
          ./gradlew bundleRelease assembleRelease --no-daemon
          mkdir -p ../release
          cp app/build/outputs/bundle/release/app-release.aab "../release/maqsad-${BLOKNOT_VERSION_NAME}-build${BLOKNOT_VERSION_CODE}.aab"
          cp app/build/outputs/apk/release/app-release.apk "../release/maqsad-${BLOKNOT_VERSION_NAME}-build${BLOKNOT_VERSION_CODE}.apk"
      - uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_KEY == 'true'
        with:
          name: maqsad-release
          path: release/*
          if-no-files-found: error

  desktop:
    name: Build ${{ matrix.name }} app
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            targets: --win nsis
            artifact: maqsad-windows
            files: desktop/release/*.exe
          - name: Linux
            os: ubuntu-latest
            targets: --linux AppImage deb
            artifact: maqsad-linux
            files: |
              desktop/release/*.AppImage
              desktop/release/*.deb
          - name: macOS
            os: macos-latest
            # Intel and Apple Silicon Macs each get their own .dmg.
            targets: --mac dmg --x64 --arm64
            artifact: maqsad-mac
            files: desktop/release/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      # No paid certificates: Windows gets an unsigned installer (SmartScreen note), the Mac app an
      # ad-hoc signature (Apple Silicon refuses fully unsigned apps; the first open needs "Open Anyway").
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Put the web app into the desktop app
        run: |
          rm -rf desktop/web
          cp -r dist desktop/web
      - run: npm ci
        working-directory: desktop
      - name: Build the installer
        working-directory: desktop
        run: |
          VERSION="$(node -p "require('../package.json').version")"
          npx electron-builder ${{ matrix.targets }} --publish never -c.extraMetadata.version="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      # Microsoft Store package (the Store signs it). With the three identity values from Partner
      # Center set as repository Variables (docs/msstore/PUBLISH.md) it is uploaded as maqsad-msstore;
      # without them it is still built with placeholder values, only to prove the packaging works.
      - name: Build the Microsoft Store package
        if: matrix.name == 'Windows'
        working-directory: desktop
        env:
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_NAME: ${{ vars.MSSTORE_PUBLISHER_NAME }}
        run: |
          if [ -n "$MSSTORE_IDENTITY_NAME" ] && [ -n "$MSSTORE_PUBLISHER" ] && [ -n "$MSSTORE_PUBLISHER_NAME" ]; then
            echo "STORE_READY=1" >> "$GITHUB_ENV"
          else
            echo "::notice::Store identity not set yet (docs/msstore/PUBLISH.md): building with placeholders, not uploading."
            MSSTORE_IDENTITY_NAME="Maqsad.Placeholder"
            MSSTORE_PUBLISHER="CN=00000000-0000-0000-0000-000000000000"
            MSSTORE_PUBLISHER_NAME="Maqsad"
          fi
          VERSION="$(node -p "require('../package.json').version")"
          npx electron-builder --win appx --publish never \
            -c.extraMetadata.version="$VERSION" \
            -c.appx.identityName="$MSSTORE_IDENTITY_NAME" \
            -c.appx.publisher="$MSSTORE_PUBLISHER" \
            -c.appx.publisherDisplayName="$MSSTORE_PUBLISHER_NAME"
          ls -la release/*.appx
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'Windows' && env.STORE_READY == '1'
        with:
          name: maqsad-msstore
          path: desktop/release/*.appx
          if-no-files-found: error

  deploy-pages:
    name: Publish web version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
