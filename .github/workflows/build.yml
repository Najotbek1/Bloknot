name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, test, build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke-test the build in a browser
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  android:
    name: Build Android APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run android:sync
      - name: Assemble APK
        working-directory: android
        env:
          BLOKNOT_VERSION_CODE: ${{ github.run_number }}
        run: |
          export BLOKNOT_VERSION_NAME="$(node -p "require('../package.json').version")"
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../apk
          cp app/build/outputs/apk/debug/app-debug.apk "../apk/bloknot-${BLOKNOT_VERSION_NAME}-build${BLOKNOT_VERSION_CODE}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: bloknot-apk
          path: apk/*.apk
          if-no-files-found: error

  deploy-pages:
    name: Publish web version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
